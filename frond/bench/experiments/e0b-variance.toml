# E0b: variance on the screening model (ledger E0b, research.md, D48). Descriptive, so no claims: two trials of
# Opus 5.5 on each of E0's tasks, for the within- and between-task variance that sizes E1-E6. E0's 10 tasks less the two its trials showed the cyber classifier refuses (D57), so 8.
# One arm, two trials per task, so that the analysis's within-task variance has its pairs (Codex, #50). The guard
# (D43) puts the job at 16 x $3.00 = $48 at most; E0's Opus trials cost $1.33 on average.
# The cut-off message no longer mentions reasoning (G47), the one harness change since E0; biped-contact-dynamics,
# refused after a cut-off in all three of its earlier Opus and Sonnet trials, shows whether that mattered.
id = "E0b"
title = "Variance on the screening model: two more trials per task"
dataset = "terminal-bench/terminal-bench@4.0.0"
tasks = [
  "biped-contact-dynamics",
  "glycan-ms2-elucidation",
  "hof-topology-interpenetration",
  "layout-config-recreation",
  "layout-config-recreation2",
  "mvcc-lsm-compaction",
  "nextjs-performance",
  "ontology-kg-querying",
]
trials = 2
batch = 8
seed = 0
concurrency = 2

[[arms]]
name = "opus"
agent = "frond_harbor:Frond"
model = "anthropic/claude-opus-5-5"
options = { effort = "high", protocol = "json" }
