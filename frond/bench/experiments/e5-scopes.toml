# E5, hypothesis H5: scopes as savepoints (collapse finished subtasks, rewind abandoned ones) raise long-horizon pass
# rate and cut cost (D35). Also measures A1-A4 and A10: scope counts, and history_step calls on collapsed steps.
# The model is Opus 5.5, the screening model E0 chose by the rule in research.md (D56). Both arms get 150 steps: long-horizon tasks need far more than TB's 40, and
# the context mechanisms only act once a turn outgrows the budget. E0 also says how often TB turns fold (A5).
id = "E5"
title = "H5: scopes as savepoints, on long tasks"
dataset = "silrlab/long-horizon-terminal-bench-2.0"
tasks = "datasets/long-horizon-terminal-bench-2.0.txt"
sample = 20
trials = 2
batch = 10
concurrency = 2
stop_early = true
seed = 5

[[arms]]
name = "off"
agent = "frond_harbor:Frond"
model = "anthropic/claude-opus-5-5"
options = { scopes = "off", max_steps = "150", effort = "high" }

[[arms]]
name = "on"
agent = "frond_harbor:Frond"
model = "anthropic/claude-opus-5-5"
options = { scopes = "on", max_steps = "150", effort = "high" }

[[claims]]
id = "H5-pass"
metric = "pass"
treatment = "on"
control = "off"
kind = "superiority"

[[claims]]
id = "H5-cost"
metric = "cost"
treatment = "on"
control = "off"
kind = "ratio-below"
bound = 1.0
