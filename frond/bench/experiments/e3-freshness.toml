# E3, hypothesis H3: naming stale reads in the prompt, and refusing to overwrite what changed since a read, cuts
# failed edits and wrong-state actions without lowering pass rate (D30). Both arms count stale actions.
# The model is Opus 5.5, the screening model E0 chose by the rule in research.md (D56). Sample size follows E0's variance; these are the planned upper bounds.
id = "E3"
title = "H3: freshness marks and compare-and-swap writes"
dataset = "terminal-bench/terminal-bench@4.0.0"
tasks = "datasets/terminal-bench@4.0.0.txt"
exclude = [
  "datasets/terminal-bench@4.0.0-exceeds-4cpu-nogpu.txt",
  "results/2026-11-03-e0a-oracle/oracle-failures.txt",
  "datasets/terminal-bench@4.0.0-refused-cyber.txt",  # D57
]
trials = 3
batch = 14  # four looks over the 51 tasks E0a and D57 leave (14, 14, 14, 9), D44
seed = 3
concurrency = 2

[[arms]]
name = "off"
agent = "frond_harbor:Frond"
model = "anthropic/claude-opus-5-5"
options = { freshness = "off", effort = "high" }

[[arms]]
name = "on"
agent = "frond_harbor:Frond"
model = "anthropic/claude-opus-5-5"
options = { freshness = "on", effort = "high" }

[[claims]]
id = "H3-failed-edits"
metric = "failed_edits"
treatment = "on"
control = "off"
kind = "superiority"
lower_is_better = true

[[claims]]
id = "H3-pass"
metric = "pass"
treatment = "on"
control = "off"
kind = "non-inferiority"
margin = 0.05
