# E2, hypothesis H2: forking up to three branches at the model's request, keeping the one its check passes, raises
# pass rate; the shared cached prefix keeps cost under twice the single line's (D32).
# The model is Opus 5.5, the screening model E0 chose by the rule in research.md (D56). Sample size follows E0's variance; these are the planned upper bounds.
id = "E2"
title = "H2: FORK with check-based selection"
dataset = "terminal-bench/terminal-bench@4.0.0"
tasks = "datasets/terminal-bench@4.0.0.txt"
exclude = [
  "datasets/terminal-bench@4.0.0-exceeds-4cpu-nogpu.txt",
  "results/2026-11-03-e0a-oracle/oracle-failures.txt",
  "datasets/terminal-bench@4.0.0-refused-cyber.txt",  # D57
]
trials = 3
batch = 14  # four looks over the 51 tasks E0a and D57 leave (14, 14, 14, 9), D44
seed = 2
concurrency = 2
agent_timeout_multiplier = 0.25  # TB 4.0's 8-hour agent timeout becomes 2 hours (D59, G51)
stop_early = true

[[arms]]
name = "single"
agent = "frond_harbor:Frond"
model = "anthropic/claude-opus-5-5"
options = { fork = "1", effort = "high" }

[[arms]]
name = "fork3"
agent = "frond_harbor:Frond"
model = "anthropic/claude-opus-5-5"
options = { fork = "3", effort = "high" }

[[claims]]
id = "H2-pass"
metric = "pass"
treatment = "fork3"
control = "single"
kind = "superiority"

[[claims]]
id = "H2-cost"
metric = "cost"
treatment = "fork3"
control = "single"
kind = "ratio-below"
bound = 2.0
