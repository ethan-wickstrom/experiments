# The program's spending cap for model calls (ledger REQ-1, decision D43): the owner's grant of 2026-11-03.
# The key's Console workspace has the same spend limit, which stops a job midway; bench/matrix.py refuses to start a
# Harbor job that could take the total past it.
usd = 100.0

# A job's trials are assumed to cost the most one trial of their model has cost so far, times this margin.
margin = 1.5

# Before any trial of a model has been measured: USD per trial at frond's default of 40 steps, scaled by an arm's
# max_steps / 40. From the second paid smoke (2026-11-03): 3 Opus 5.5 steps at high effort cost $0.70, 27k output
# tokens of which 17.6k thinking, about $0.23 a step, so about $5 for 40 steps at $0.12 a step (later steps are
# smaller than a 3-step run's). Sonnet is half of Opus, Haiku a fortieth, by list price (D48). Keys match models as in
# prices.toml.
[guess]
claude-opus-5-5 = 5.0
claude-sonnet-5-5 = 2.5
claude-haiku-5-5 = 0.15

# Spending the trials under jobs/ cannot show (G37): jobs lost with an earlier VM, trials killed before they wrote
# their cost, and calls made outside Harbor. An entry with `jobs` stands in for that directory under jobs/, which the
# guard then does not scan. Add an entry for every paid run before its VM can go away, and for every killed trial.
[[spent]]
jobs = "SMOKE"
usd = 0.044
why = "2026-11-03: first paid smoke, frond on Opus 5.5, one step before G34 ended it (its usage.json)"

[[spent]]
jobs = "SMOKE-2"
usd = 0.702
why = "2026-11-03: second paid smoke, frond on Opus 5.5, 3 steps (its usage.json)"

[[spent]]
jobs = "E0-aborted-1"
usd = 1.31
why = "2026-11-03: E0's first start, stopped for G36: one Haiku trial at $0.025, and two killed before writing their cost, each bounded by 40 steps of 32k output at Haiku's $0.50/M ($0.64)"

