[project]
name = "rachis"
version = "0.1.0"
description = "A monospaced typeface for code, plain-text mathematics and terminal interfaces, generated by a program"
readme = "README.md"
license = "Apache-2.0 AND OFL-1.1"
requires-python = ">=3.12"
dependencies = [
    "fonttools[woff,unicode]>=4.68.0",
    "ufoLib2>=0.18",
    "fontmake>=3.12.2",
    "skia-pathops>=0.9.2",
    "ttfautohint-py>=0.6.1",
]

[project.scripts]
rachis = "rachis.cli:main"

[dependency-groups]
dev = [
    "ruff>=0.17.3",
    "ty>=0.0.95",
    "pillow>=12.0",
    "uharfbuzz>=0.57",
    "numpy>=2.3",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests", "."]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4", "PIE", "RUF", "PERF"]
ignore = [
    "RUF001", # ambiguous unicode: a font's source names the characters it draws
    "RUF002",
    "RUF003",
    "E741",   # l, O and I are glyph names here
    "E743",
]

[tool.ruff.format]
quote-style = "double"

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
include = ["src", "tests"]
